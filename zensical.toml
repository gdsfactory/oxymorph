[project]
site_url = "https://gdsfactory.github.io/oxymorph/"
site_name = "oxymorph"
site_description = "A Rust port of the morphnet netlist parser"
repo_url = "https://github.com/gdsfactory/oxymorph"
repo_name = "gdsfactory/oxymorph"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Examples" = "examples.md" },
  { "Equivalence" = "equivalence.md" },
  { "Playground" = "playground.md" },
  { "API" = "api.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.code.annotate",
  "navigation.footer",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "content.tabs.link",
  "content.tooltips",
]

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
