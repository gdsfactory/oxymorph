[package]
name = "oxymorph-python"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/gdsfactory/oxymorph"

[lib]
name = "oxymorph"
crate-type = ["cdylib", "rlib"]

[dependencies]
oxymorph-schema = { path = "../oxymorph-schema" }
oxymorph-netlist = { path = "../oxymorph-netlist" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39", "indexmap"] }
indexmap = { version = "2", features = ["serde"] }
serde = "1"
serde_json = "1"

# Apple's `strip` (run by the release profile's default `strip = "debuginfo"`) leaves a
# mis-aligned LINKEDIT string pool with ld-27037 on macOS 27, and dyld refuses the module.
# An unstripped release build loads everywhere.
[profile.release]
strip = false
