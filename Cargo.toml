[workspace]
resolver = "2"
members = [
    "crates/oxymorph-schema",
    "crates/oxymorph-netlist",
    "crates/oxymorph",
]
exclude = ["crates/oxymorph-python", "crates/oxymorph-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/gdsfactory/oxymorph"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_repr = "0.1"
indexmap = { version = "2", features = ["serde"] }
lark-rs = { git = "https://github.com/okalldal/lark", rev = "aa0d62001249a133ec804c65c1622c8e598f1b62" }
regex = "1"

[profile.release]
opt-level = 3
